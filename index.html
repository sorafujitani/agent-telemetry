<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>panopticon</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml">
		<link rel="stylesheet" href="/style.css">
		<script src="/app.js" defer></script>
	</head>
	<body>
		<aside>
			<div class="top">
				<input type="search" id="sq" placeholder="filter sessions" aria-label="Filter sessions">
				<button type="button" id="clear" title="truncate events.jsonl">clear</button>
			</div>
			<div id="side"></div>
		</aside>
		<main id="mainEl">
			<div id="head">
				<div id="stats"><p class="dim">select a session</p></div>
				<div class="tabs">
					<button type="button" data-tab="timeline" class="on">timeline</button>
					<button type="button" data-tab="exec">show exec</button>
					<span class="tools">
						<input
							type="search"
							id="tq"
							placeholder="filter tool / args"
							aria-label="Filter tool calls"
						>
						<button type="button" data-f="err">errors</button>
						<button type="button" data-f="slow">slow &gt;10s</button>
						<button
							type="button"
							data-f="notify"
							title="desktop notification when a run ends while this tab is hidden"
							aria-label="Notify when a run ends"
						>
							🔔
						</button>
						<span class="dim legend" title="click a row for details">
							<span class="model-key">■</span>
							model<span class="acc">■</span> tools
							<span class="selection-key">
								·<span class="warn">●</span> selected
								<span class="parallel-key">■</span> overlapping
							</span>
						</span>
					</span>
				</div>
			</div>
			<div id="body"></div>
			<div id="detail"></div>
		</main>
		<button type="button" id="jump">↓ latest</button>
	</body>
</html>
